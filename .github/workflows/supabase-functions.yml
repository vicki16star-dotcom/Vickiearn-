name: Deploy Supabase Edge Functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/supabase-functions.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-functions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate deployment secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo 'Missing GitHub secret: SUPABASE_ACCESS_TOKEN'; exit 1; }
          test -n "$SUPABASE_PROJECT_REF" || { echo 'Missing GitHub secret: SUPABASE_PROJECT_REF'; exit 1; }
          echo "Supabase project ref is configured."

      - name: Verify functions exist
        shell: bash
        run: |
          set -euo pipefail
          for fn in paystack-initialize paystack-webhook paystack-withdraw paystack-transfer; do
            test -f "supabase/functions/$fn/index.ts" || { echo "Missing function source: $fn"; exit 1; }
          done

      - name: Deploy paystack-initialize
        run: supabase functions deploy paystack-initialize --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt

      - name: Deploy paystack-webhook
        run: supabase functions deploy paystack-webhook --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt

      - name: Deploy paystack-withdraw
        run: supabase functions deploy paystack-withdraw --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy paystack-transfer
        run: supabase functions deploy paystack-transfer --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deployment complete
        run: echo 'All four VickiEarn Paystack Edge Functions deployed successfully.'
